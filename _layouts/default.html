<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
  <meta name="author" content="{{ site.author }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}" />
  <meta property="og:image" content="{{ page.image | default: '/og.png' | absolute_url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  {% if page.date %}<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />{% endif %}
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c3aed'/%3E%3Cpath d='M30 76 50 22 70 76M37 58h26' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="light dark" />
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f2f0eb; --bg-card: #faf9f6; --border: #dedad3;
      --text: #1c1917; --text-2: #44403c; --text-3: #57534e;
      --accent: #7c3aed; --accent-h: #6d28d9;
      --code-bg: #ebe8e1;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0b0b; --bg-card: #111111; --border: #1e1e1e;
        --text: #e4e4e4; --text-2: #b5b5b5; --text-3: #8f8f8f;
        --accent: #a78bfa; --accent-h: #c4b5fd;
        --code-bg: #161616;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0b0b; --bg-card: #111111; --border: #1e1e1e;
      --text: #e4e4e4; --text-2: #b5b5b5; --text-3: #8f8f8f;
      --accent: #a78bfa; --accent-h: #c4b5fd;
      --code-bg: #161616;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px; line-height: 1.65;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-h); text-decoration: underline; }
    .nav { border-bottom: 1px solid var(--border); }
    .nav-inner {
      max-width: 720px; margin: 0 auto; padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .nav-logo { color: var(--text); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .nav-logo:hover { text-decoration: none; color: var(--accent); }
    .nav-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }
    .nav-links { list-style: none; display: flex; gap: 18px; font-size: 14px; }
    .nav-links a { color: var(--text-2); }
    main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
    .footer {
      max-width: 720px; margin: 0 auto; padding: 24px 16px 40px;
      border-top: 1px solid var(--border); color: var(--text-3); font-size: 14px;
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .footer a { color: var(--text-3); }
    .post-head { margin-bottom: 32px; }
    .post-head h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -0.01em; margin-bottom: 12px; }
    .post-meta { color: var(--text-3); font-size: 14px; }
    .post-body h2 { font-size: 1.35rem; margin: 40px 0 12px; line-height: 1.3; }
    .post-body h3 { font-size: 1.1rem; margin: 28px 0 8px; }
    .post-body p, .post-body ul, .post-body ol, .post-body blockquote, .post-body table, .post-body pre { margin-bottom: 18px; }
    .post-body ul, .post-body ol { padding-left: 24px; }
    .post-body li { margin-bottom: 6px; }
    .post-body img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 6px; background: #fcfcfb; }
    .post-body figure { margin: 24px 0; }
    .post-body figcaption { color: var(--text-3); font-size: 14px; margin-top: 8px; }
    .post-body blockquote { border-left: 3px solid var(--border); padding-left: 16px; color: var(--text-2); }
    .post-body code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
    .post-body pre { background: var(--code-bg); padding: 14px 16px; border-radius: 6px; overflow-x: auto; font-size: 14px; line-height: 1.5; }
    .post-body pre code { background: none; padding: 0; }
    .post-body table { border-collapse: collapse; width: 100%; font-size: 15px; display: block; overflow-x: auto; }
    .post-body th, .post-body td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
    .post-body th { background: var(--bg-card); }
    .post-body hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
    .post-list { list-style: none; }
    .post-list li { padding: 18px 0; border-bottom: 1px solid var(--border); }
    .post-list a { color: var(--text); font-size: 1.15rem; font-weight: 600; }
    .post-list a:hover { color: var(--accent); }
    .post-list .post-meta { margin-top: 4px; }
    .post-list p { color: var(--text-2); margin-top: 6px; font-size: 15px; }
    .page-title { font-size: 2rem; margin-bottom: 8px; }
    .page-lead { color: var(--text-2); margin-bottom: 24px; }
  </style>
</head>
<body>
<nav class="nav" aria-label="Main navigation">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><span class="nav-dot" aria-hidden="true"></span>Ana Do</a>
    <ul class="nav-links">
      <li><a href="/#projects">Projects</a></li>
      <li><a href="/writing/">Writing</a></li>
      <li><a href="https://github.com/anaexplores">GitHub</a></li>
    </ul>
  </div>
</nav>
<main id="main">
{{ content }}
</main>
<footer class="footer">
  <span>© 2026 Ana Do</span>
  <a href="https://github.com/anaexplores">GitHub</a>
  <a href="https://orcid.org/0009-0000-6728-9230">ORCID</a>
  <a href="/feed.xml">RSS</a>
</footer>
</body>
</html>
