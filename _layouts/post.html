---
layout: default
---
<article>
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.updated %} · updated <time datetime="{{ page.updated | date_to_xmlschema }}">{{ page.updated | date: "%-d %B %Y" }}</time>{% endif %}
      · {{ site.author }}
    </p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <p class="post-meta">This post is licensed under <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>. You can reuse it with credit to {{ site.author }}.</p>
</article>
